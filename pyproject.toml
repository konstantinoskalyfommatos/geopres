[project]
name = "geopres"
version = "0.1.0"
description = "Post-hoc dimensionality reduction of text embeddings that preserves pairwise geometry."
readme = "README.md"
# Floor set by sentence-transformers 5.3.0, which needs >=3.10. No upper bound:
# capping it only makes pip refuse to install on newer Pythons that work fine.
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Konstantinos Kalyfommatos" }]
keywords = [
    "embeddings",
    "dimensionality-reduction",
    "sentence-transformers",
    "mteb",
    "linear-projection",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Core = what the GeoPres library itself needs: torch, a sentence-transformers
# backbone, and safetensors for the weights.
dependencies = [
    "numpy>=1.24",
    "safetensors>=0.4",
    "sentence-transformers==5.3.0",
    "torch>=2.0",
    "tqdm>=4.60",
    "transformers==4.57.6",
]

[project.optional-dependencies]
# Everything needed to reproduce the paper: precalculate -> train -> evaluate -> tables.
research = [
    "accelerate",
    "datasets",
    "huggingface-hub",
    "matplotlib",
    "mteb==2.12.26",
    "pandas",
    "scikit-learn",
    "scipy",
    "statsmodels>=0.14.6",
]
# Only needed for the Spearman loss (--spearman). Separate extra because
# torchsort has to be compiled against your CUDA toolchain.
spearman = ["torchsort"]
dev = ["pytest"]

[project.scripts]
geopres-precalculate = "geopres.precalculate_embeddings:main"
geopres-train = "geopres.train_model:main"
geopres-eval = "geopres.eval_model:main"
geopres-eval-backbone = "geopres.eval_backbone:main"
geopres-compare = "geopres.compare_results:main"

[project.urls]
Repository = "https://github.com/konstantinoskalyfommatos/geopres"
Issues = "https://github.com/konstantinoskalyfommatos/geopres/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the library + pipeline is shipped; analysis/ (tables, plots) is not.
packages = ["geopres"]

[tool.hatch.build.targets.sdist]
# Explicit list: hatchling otherwise packs every file that is not gitignored,
# so a stray virtualenv or a downloaded model would end up in the tarball.
include = [
    "AGENTS.md",
    "CITATION.cff",
    "LICENSE",
    "README.md",
    "analysis",
    "geopres",
    "pyproject.toml",
    "tests",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
